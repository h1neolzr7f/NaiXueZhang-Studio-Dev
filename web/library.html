<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的图库 · Nai学长工作室</title>
  <link rel="stylesheet" href="/assets/shared/site-nav.css?v=756cdf2a38" />
  <link rel="stylesheet" href="/assets/shared/experience-rail.css?v=553c63addd" />
  <link rel="stylesheet" href="/assets/studio-theme.css?v=51de05869a" />
</head>
<body data-page="library">
  <div id="siteNav"></div>
  <main class="ex-page">
    <section class="ex-hello">
      <div>
        <h1>我的图库</h1>
        <p>管理你的所有本地素材与生成资产</p>
      </div>
    </section>
    <section class="ex-ribbon" data-ribbon>
      <div><small>资产总数</small><b data-stat-total>0</b></div>
      <div><small>图片</small><b data-stat-images>0</b></div>
      <div><small>收藏</small><b data-stat-favs>0</b></div>
      <div><small>合集入口</small><b data-stat-collections>0</b></div>
      <div><small>占用空间</small><b data-stat-size>—</b></div>
      <div><small>磁盘剩余</small><b data-stat-free>—</b></div>
    </section>
    <form class="ex-toolbar" data-search>
      <button class="ex-tab is-on" type="button" data-kind="all">全部</button>
      <button class="ex-tab" type="button" data-kind="images">图片</button>
      <select name="gallery" data-gallery>
        <option value="site">本机图库</option>
        <option value="codex">自选库</option>
        <option value="qqgroup">QQ 群库</option>
      </select>
      <input name="q" type="search" placeholder="角色 / 标签 / ID / 作者 / 咒语" style="flex:1;min-width:220px" />
      <select name="sort"><option value="new">创建时间</option><option value="monthly">收藏热度</option></select>
      <button class="ex-btn primary" type="submit">搜索</button>
    </form>
    <div class="ex-lib">
      <aside class="ex-inner-side">
        <h3>快速访问</h3>
        <a href="/library">最近导入</a>
        <a href="/generated">最近生成</a>
        <a href="/favorites">收藏</a>
        <a href="/codex">自选库</a>
        <h3>我的合集</h3>
        <a href="/codex" data-collection>角色设定</a>
        <a href="/references" data-collection>参考库</a>
        <a href="/tag-assets" data-collection>本地资产</a>
        <h3>标签</h3>
        <div class="ex-tags" data-tags></div>
      </aside>
      <section>
        <div class="ex-grid" data-grid></div>
        <p class="ex-empty" data-status></p>
        <div class="ex-select-bar">
          <span data-picked>未选择资产</span>
          <div class="ex-actions">
            <a class="ex-btn" href="/favorites">收藏</a>
            <a class="ex-btn" data-remix href="/remix">换角色</a>
            <a class="ex-btn primary" data-use href="/studio">用此图生成</a>
          </div>
        </div>
      </section>
      <aside class="ex-panel" data-detail>
        <h3>资产详情</h3>
        <p class="ex-empty">点选一张作品查看来源与谱系。</p>
      </aside>
    </div>
  </main>
  <script src="/assets/shared/api-client.js?v=2a8a70c746"></script>
  <script src="/assets/shared/work-bridge.js?v=e03f149e05"></script>
  <script src="/assets/shared/site-nav.js?v=3846bb4a62"></script>
  <script src="/assets/library-desk.js?v=03ad25350a"></script>
</body>
</html>
